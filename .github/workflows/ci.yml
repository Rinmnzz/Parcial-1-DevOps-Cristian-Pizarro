name: Java CI/CD Pipeline con Maven y Docker

on:
  push:
    
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias (Obligatorio)
        run: ./mvnw test

      - name: Compilar Paquete
        run: ./mvnw -B clean package -DskipTests

      - name: Escaneo de Seguridad (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/perfulandia-envio:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Simular Despliegue y Trazabilidad
        run: |
          echo "Iniciando despliegue trazable..."
          echo "Commit ID: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          echo "Despliegue simulado exitoso en el entorno Cloud"