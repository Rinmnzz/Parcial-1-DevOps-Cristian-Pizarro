name: Java CI/CD Pipeline con Maven y Docker

on:
  push:
    
    
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Unitarias (Obligatorio)
        # Usamos 'mvn' en lugar de './mvnw'
        run: mvn test 
        # ATENCIÓN: Si tus archivos NO están en una subcarpeta, borra la línea de abajo
        working-directory: ./Tienda-Perfumes-API-envio/Perfulandia_envio-master

      - name: Compilar Paquete
        run: mvn -B clean package -DskipTests
        # ATENCIÓN: Si tus archivos NO están en una subcarpeta, borra la línea de abajo
        working-directory: ./Tienda-Perfumes-API-envio/Perfulandia_envio-master

      - name: Escaneo de Seguridad (Snyk)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=Tienda-Perfumes-API-envio/Perfulandia_envio-master/pom.xml --severity-threshold=high
          
  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          # ATENCIÓN: Si tus archivos están en la raíz, deja solo el punto '.'
          context: ./Tienda-Perfumes-API-envio/Perfulandia_envio-master
          push: true
          tags: ghcr.io/${{ github.repository }}/perfulandia-envio:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Simular Despliegue y Trazabilidad
        run: |
          echo "Iniciando despliegue trazable..."
          echo "Commit ID: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
          echo "¡Despliegue simulado exitoso en el entorno Cloud!"