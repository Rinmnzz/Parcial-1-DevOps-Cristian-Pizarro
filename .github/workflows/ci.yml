name: Java CI con Maven

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar (Saltando Pruebas)
        run: mvn -B clean package -DskipTests
        working-directory: ./Tienda-Perfumes-API-envio/Perfulandia_envio-master